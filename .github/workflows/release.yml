# 构建 release APK 并发布 GitHub Release
# 触发方式：
#   1. 推送 v 开头的 tag（如 v1.0.3）→ 构建并创建 Release，附上 APK + SHA-256
#   2. Actions 页面手动 Run workflow → 仅构建，APK 保存为 workflow artifact
#
# 签名（可选但强烈建议）：在仓库 Settings → Secrets and variables → Actions 添加：
#   FUNCLASS_KEYSTORE_BASE64  keystore 文件的 base64（certutil -encode x.jks x.txt 后取正文，或 base64 -w0 x.jks）
#   FUNCLASS_STORE_PASSWORD   keystore 密码
#   FUNCLASS_KEY_ALIAS        key 别名
#   FUNCLASS_KEY_PASSWORD     key 密码
# 不配置时回退 debug 签名：能构建能安装，但每次构建密钥不同，无法覆盖安装旧版本。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable
          cache: true

      - name: 注入签名密钥（可选）
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FUNCLASS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FUNCLASS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FUNCLASS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FUNCLASS_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/funclass.jks
            {
              echo "FUNCLASS_STORE_FILE=funclass.jks"
              echo "FUNCLASS_STORE_PASSWORD=$STORE_PASSWORD"
              echo "FUNCLASS_KEY_ALIAS=$KEY_ALIAS"
              echo "FUNCLASS_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "mode=keystore" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置签名密钥 secrets，本次 APK 使用临时 debug 签名：可以安装，但与之前构建的包签名不同，需要先卸载旧版，且后续每次构建都如此。正式发布请按文件头部注释配置 secrets。"
          fi

      - name: 测试
        run: flutter test

      - name: 种入 CI 构建编号
        run: |
          # CI 构建编号 = 1000 + 本次运行序号：恒大于本地 tool/.build_number（当前约 37），
          # 且随流水线运行次数单调递增，保证手机上覆盖安装不会因 versionCode 倒退被拒
          echo $((1000 + ${{ github.run_number }})) > tool/.build_number

      - name: 构建 APK
        run: bash tool/build_apk.sh

      - name: 定位产物并生成校验文件
        id: apk
        run: |
          APK="$(ls build/app/outputs/flutter-apk/funclass-*-release.apk | head -n 1)"
          sha256sum "$APK" > "$APK.sha256"
          echo "file=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=${APK}.sha256" >> "$GITHUB_OUTPUT"
          echo "### 构建产物" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" >> "$GITHUB_STEP_SUMMARY"
          echo "签名模式：$([[ -f android/app/funclass.jks ]] && echo keystore || echo debug)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: 手动运行（无 tag）→ 上传 artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: funclass-apk
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.sha }}
          if-no-files-found: error
