name: funclass
description: "趣课 - 课外兴趣课管理 App"
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ===== 数据库 Drift (SQLite) =====
  drift: ^2.22.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.30
  path_provider: ^2.1.5
  path: ^1.9.1

  # ===== 状态管理 Riverpod =====
  flutter_riverpod: ^2.6.1

  # ===== 本地通知 =====
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # ===== 日历 =====
  table_calendar: ^3.1.3

  # ===== 图表 =====
  fl_chart: ^0.69.0

  # ===== WebDAV =====
  webdav_client: ^1.2.2

  # ===== 日期时间 / 格式化 =====
  intl: ^0.20.2

  # ===== 加密（密码加密存储） =====
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4

  # ===== 液态玻璃 =====
  liquid_glass_easy: ^4.2.0

  # ===== 工具 =====
  collection: ^1.19.1
  shared_preferences: ^2.5.5
  file_picker: ^11.0.3
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ===== 代码生成 =====
  drift_dev: ^2.22.0
  build_runner: ^2.4.15
  flutter_launcher_icons: 0.14.3

flutter:
  uses-material-design: true

  # 设置页「桌面图标」卡片的预览图，由 tool/icon_design/export_android.py 生成——来自Trae
  assets:
    - assets/icons/launcher/

# ===== App Icon =====
# 通过 dart run flutter_launcher_icons 生成各平台图标——来自Trae
# 注意：这个工具只会重写 ic_launcher 那一套（也就是设置页里的「经典」），
# 另外四款可切换图标（ic_launcher_puzzle / smile / book / spark）由
# tool/icon_design 下的脚本维护，跑这个工具不会动它们。——来自Trae
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_v3.jpg"
  min_sdk_android: 21
  remove_alpha_ios: true
